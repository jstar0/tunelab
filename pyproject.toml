[project]
name = "tunelab"
version = "0.1.0"
description = "Reproducible, resumable hyperparameter experiments with transparent search strategies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12.0",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
tunelab = "tunelab.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tunelab"]

[dependency-groups]
dev = [
  "httpx2>=2.12.0",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/tunelab/report.py" = ["E501"]
